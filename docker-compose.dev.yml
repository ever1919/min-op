services:
  backend:
    build: ./backend
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: ./backend/.env

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm ci --silent && npm start"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
